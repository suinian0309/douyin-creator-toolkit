name: 构建发布

on:
  push:
    branches: [ "main", "release" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 pnpm
        run: npm install -g pnpm

      - name: 安装前端依赖
        run: |
          echo 'onlyBuiltDependencies=esbuild' >> .npmrc
          pnpm install --frozen-lockfile

      - name: 安装 Rust 稳定版
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 编译产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: 下载运行时资源（python-embed / FFmpeg / GPU DLL）
        run: |
          powershell -ExecutionPolicy Bypass -File "./src-tauri/scripts/prepare_runtime.ps1"
        shell: pwsh

      - name: 构建前端
        run: pnpm build

      - name: 构建 Tauri 安装包并创建 Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: '抖音运营工具箱 v__VERSION__'
          releaseBody: '自动构建 Release'
          releaseDraft: true
          prerelease: false
